<!doctype html>
<html lang="{{.Lang}}" data-theme="{{.Theme}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/wattson_themes.css"><link rel="stylesheet" href="/access.css"><script src="/access.js" defer></script></head>
<body><main><header><h1>{{.Title}}</h1><p>{{.Description}}</p></header><section><form data-offline="{{.Offline}}" data-loading="{{.Loading}}" method="post" action="/login?lang={{.Lang}}&amp;theme={{.Theme}}"><input type="hidden" name="next" value="{{.Next}}"><label for="access-key">{{.Label}}</label><input id="access-key" name="token" type="password" autocomplete="current-password" required><p role="alert" id="access-error" {{if not .Message}}hidden{{end}}>{{.Message}}</p><button type="submit">{{.Button}}</button></form></section><footer><p>{{.Help}}</p><nav aria-label="Language"><a href="?lang=fr&amp;theme={{.Theme}}">Français</a><a href="?lang=en&amp;theme={{.Theme}}">English</a></nav><nav aria-label="Theme"><a href="?lang={{.Lang}}&amp;theme=sombre">{{.Dark}}</a><a href="?lang={{.Lang}}&amp;theme=etat">{{.Light}}</a></nav></footer></main></body>
</html>
