name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Namespace-bound identity tests require a runner permitting unprivileged
    # uid-map fixtures and recent pidfd namespace ioctls. The user authorized
    # one temporary sysctl on this disposable CI VM only; always restore it.
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select Python build runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare owned namespace test environment
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/swarm-userns-before"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check owned namespace fixture prerequisite
        run: /usr/bin/unshare --user --map-root-user --mount --pid --fork /bin/true # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 tools/check_distribution.py
      - run: python3 tools/agent-workflows/check.py
      - run: bash -n install.sh swarm.sh && sh -n deploy/entrypoint.sh
      - run: make build
      - run: SWARM_TEST_BINARY="$PWD/bin/swarm" python3 tests/test_swarm_local.py
      - run: python3 tests/test_rust_distribution.py
      # Operator /tmp interdiction (2026-10-31): lib tests allocate fixture
      # roots below TMPDIR and refuse the system temp directory
      # ("recipe fixture area required"). Pin TMPDIR to the governed fixture
      # area exactly like the local recipe runner (tools/verification/recipe.py):
      # Admin-configured area, falling back to the private operator state area
      # when a checkout ancestor is group/other-writable; never /tmp.
      - name: Pin TMPDIR to the governed fixture area
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import importlib.util, pathlib, os
          spec = importlib.util.spec_from_file_location('fixture_area', 'tests/fixture_area.py')
          area = importlib.util.module_from_spec(spec); spec.loader.exec_module(area)
          def ancestors_private(p):
              r = pathlib.Path(p).resolve()
              for c in (r, *r.parents):
                  if os.stat(c).st_mode & 0o022:
                      return False
              return True
          d = area.configured_area() / 'runner-tmp'
          d.mkdir(mode=0o700, parents=True, exist_ok=True)
          if not ancestors_private(d):
              d = pathlib.Path.home() / '.local/state/swarm-fixtures' / 'runner-tmp'
              d.mkdir(mode=0o700, parents=True, exist_ok=True)
              if not ancestors_private(d):
                  raise SystemExit('recipe-tmpdir-ancestors-not-private: ' + str(d))
          print('SWARM_RUNNER_TMPDIR=' + str(d))
          PYEOF
      - name: Check authority log rotation and history through Admin
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          export TMPDIR="$SWARM_RUNNER_TMPDIR"
          export SWARM_PROTECTED_FIXTURE_AREA="$SWARM_RUNNER_TMPDIR"
          export SWARM_LOGS_FIXTURE_TMP="$(mktemp -d "$SWARM_RUNNER_TMPDIR/authority-logs.XXXXXXXX")"
          cargo test --manifest-path rust/Cargo.toml --locked -p swarm-authority --lib diag::rotation_tests
          cargo build --release --manifest-path rust/Cargo.toml --locked -p swarm-authority --bin swarm-authority --target-dir rust/target
          mkdir -p .cache/ci-authority-logs
          sha256sum bin/swarm rust/target/release/swarm-authority > .cache/ci-authority-logs/binaries.sha256
          node tests/authority_app_logs_http_ui.cjs bin/swarm rust/target/release/swarm-authority .cache/ci-authority-logs/browser
          sha256sum -c .cache/ci-authority-logs/binaries.sha256
      - run: TMPDIR="$SWARM_RUNNER_TMPDIR" SWARM_PROTECTED_FIXTURE_AREA="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked --workspace --lib
      - name: Check configured worker admission and extractive summary scope
        run: TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked -p swarm-engine --test agent_launch
      - name: Check admitted settlement fixture placement
        shell: bash
        run: |
          export SWARM_PAEA_DELIVERED_ADMITTED_FIXTURES=1
          export SWARM_PAEA_DELIVERED_BIN="$PWD/bin/swarm"
          SWARM_PAEA_DELIVERED_BIN_SHA256=$(sha256sum "$SWARM_PAEA_DELIVERED_BIN" | cut -d ' ' -f 1)
          export SWARM_PAEA_DELIVERED_BIN_SHA256
          output=$(mktemp -d "$SWARM_RUNNER_TMPDIR/settlement-check.XXXXXXXX")
          TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked \
            -p swarm-cli --test paea_settlement_delivered --no-run --message-format=json > "$output/cargo.json"
          test_binary=$(python3 - "$output/cargo.json" <<'PYEOF'
          import json
          import sys

          with open(sys.argv[1]) as stream:
              events = [json.loads(line) for line in stream]
          executables = [event["executable"] for event in events
                         if event.get("target", {}).get("name") == "paea_settlement_delivered"
                         and event.get("executable")]
          executable, = executables
          print(executable)
          PYEOF
          )
          nominal=delivered_settlement_commit_replay_reconcile_once
          wrong_agreement=delivered_settlement_wrong_agreement_refuses_without_effect_then_recovers
          for case in "$nominal" "$wrong_agreement"; do
            TMPDIR="$SWARM_RUNNER_TMPDIR" "$test_binary" --ignored --exact "$case" --nocapture | tee "$output/$case.log"
            grep -F "test $case ... ok" "$output/$case.log"
            grep -F "delivered-root-fixture-parent $SWARM_RUNNER_TMPDIR" "$output/$case.log"
            grep -F "delivered-identity-fixture-parent $SWARM_RUNNER_TMPDIR" "$output/$case.log"
          done
          status=0
          env -u TMPDIR "$test_binary" --ignored --exact "$nominal" --nocapture > "$output/missing.log" 2>&1 || status=$?
          test "$status" -eq 101
          grep -F "admitted fixture run requires TMPDIR" "$output/missing.log"
          status=0
          TMPDIR="$output/absent" "$test_binary" --ignored --exact "$nominal" --nocapture > "$output/invalid.log" 2>&1 || status=$?
          test "$status" -eq 101
          grep -F "delivered ledger fixture parent must be private" "$output/invalid.log"
          test ! -e "$output/absent"
          ! grep -E 'delivered-(root|identity)-fixture-parent|delivered-binary-witness' "$output/missing.log" "$output/invalid.log"
      - name: Check the P02 vault with fictional invoices
        run: TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked -p swarm-engine --test p02_vault
      - name: Replay the fictional P02 pilot and verify closure
        run: TMPDIR="$SWARM_RUNNER_TMPDIR" make check-p02-pilot
      - name: Retain P02 pilot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p02-pilot-evidence
          path: .cache/ci-p02-pilot/
          if-no-files-found: warn
          include-hidden-files: true
      - run: TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked -p swarm-cli --test version_no_repository
      - run: npm test
      - run: make smoke
      - name: Check manual retry of a failed managed worker
        run: TMPDIR="$SWARM_RUNNER_TMPDIR" python3 tests/rust_managed_worker_retry.py --binary "$PWD/bin/swarm" --output .cache/ci-managed-worker-retry --prestart-cancellation
      - run: SWARM_STATUS_CONTRACT_BINARY="$PWD/bin/swarm" python3 tools/verification/recipe.py run --recipe tools/verification/recipes/existing-cockpit-rust.json --output .cache/ci-cockpit
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Check cockpit help and task review in the embedded Cockpit
        run: |
          export SWARM_STATUS_CONTRACT_BINARY="$PWD/bin/swarm"
          export SWARM_TASK_REVIEW_FIXTURE="$SWARM_RUNNER_TMPDIR/ci-task-detail-human-review"
          python3 tools/verification/recipe.py run --recipe tools/verification/recipes/task-detail-human-review.json --output .cache/ci-task-detail-human-review
          python3 tools/verification/recipe.py verify --evidence .cache/ci-task-detail-human-review
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Check recorded exchange navigation in the embedded Cockpit
        run: TMPDIR="$SWARM_RUNNER_TMPDIR" python3 tests/rust_agent_exchanges_browser.py --binary "$PWD/bin/swarm" --output .cache/ci-exchange-navigation
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Restore namespace test environment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/swarm-userns-before" ]; then
            saved="$(cat "$RUNNER_TEMP/swarm-userns-before")"
            case "$saved" in 0|1) ;; *) exit 1 ;; esac
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$saved"
          fi

      - name: Retain cockpit recipe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-recipe-diagnostics
          path: |
            .cache/ci-exchange-navigation/result.json
            .cache/ci-exchange-navigation/failure.txt
            .cache/ci-exchange-navigation/browser.stderr
            .cache/ci-exchange-navigation/browser/failure.json
            .cache/ci-cockpit/result.json
            .cache/ci-authority-logs/binaries.sha256
            .cache/ci-authority-logs/browser/checks.json
            .cache/ci-task-detail-human-review/result.json
            .cache/ci-task-detail-human-review/step-*.stdout
            .cache/ci-task-detail-human-review/step-*.stderr
            .cache/ci-cockpit/step-*.json
            .cache/ci-cockpit/step-*.stdout
            .cache/ci-cockpit/step-*.stderr
            .cache/existing-cockpit-*/journey/browser.stderr
            .cache/existing-cockpit-*/journey/browser/failure.json
            .cache/agent-logs-*/journey/browser.stderr
            .cache/agent-logs-*/journey/browser/failure.json
          if-no-files-found: warn
          include-hidden-files: true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: |
          python3 tests/test_rust_install_outputs.py
          make test-install

      - name: Retain installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-diagnostics
          path: |
            .cache/install-native-*/commands.json
            .cache/install-native-*/*.stdout
            .cache/install-native-*/*.stderr
            .cache/install-native-*/result.json
            .cache/install-docker-*/commands.json
            .cache/install-docker-*/*.stdout
            .cache/install-docker-*/*.stderr
            .cache/install-docker-*/result.json
          if-no-files-found: warn
          include-hidden-files: true
