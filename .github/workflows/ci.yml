name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 tools/check_distribution.py
      - run: python3 tools/agent-workflows/check.py
      - run: bash -n install.sh swarm.sh && sh -n deploy/entrypoint.sh
      - run: make build
      - run: SWARM_TEST_BINARY="$PWD/bin/swarm" python3 tests/test_swarm_local.py
      - run: python3 tests/test_rust_distribution.py
      - run: cargo test --manifest-path rust/Cargo.toml --locked --workspace --lib
      - run: cargo test --manifest-path rust/Cargo.toml --locked -p swarm-cli --test version_no_repository
      - run: npm test
      - run: make smoke
      - run: SWARM_STATUS_CONTRACT_BINARY="$PWD/bin/swarm" python3 tools/verification/recipe.py run --recipe tools/verification/recipes/existing-cockpit-rust.json --output .cache/ci-cockpit
        env:
          CHROME_BIN: /usr/bin/google-chrome
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: make test-install
