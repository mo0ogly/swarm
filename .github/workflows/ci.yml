name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # Namespace-bound identity tests require a runner permitting unprivileged
    # uid-map fixtures and recent pidfd namespace ioctls. The user authorized
    # one temporary sysctl on this disposable CI VM only; always restore it.
    runs-on: ubuntu-24.04
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select Python build runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Prepare owned namespace test environment
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/swarm-userns-before"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check owned namespace fixture prerequisite
        run: /usr/bin/unshare --user --map-root-user --mount --pid --fork /bin/true # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 tools/check_distribution.py
      - run: python3 tools/agent-workflows/check.py
      - run: bash -n install.sh swarm.sh && sh -n deploy/entrypoint.sh
      - run: make build
      - run: SWARM_TEST_BINARY="$PWD/bin/swarm" python3 tests/test_swarm_local.py
      - run: python3 tests/test_rust_distribution.py
      # Operator /tmp interdiction (2026-10-31): lib tests allocate fixture
      # roots below TMPDIR and refuse the system temp directory
      # ("recipe fixture area required"). Pin TMPDIR to the governed fixture
      # area exactly like the local recipe runner (tools/verification/recipe.py):
      # Admin-configured area, falling back to the private operator state area
      # when a checkout ancestor is group/other-writable; never /tmp.
      - name: Pin TMPDIR to the governed fixture area
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import importlib.util, pathlib, os
          spec = importlib.util.spec_from_file_location('fixture_area', 'tests/fixture_area.py')
          area = importlib.util.module_from_spec(spec); spec.loader.exec_module(area)
          def ancestors_private(p):
              r = pathlib.Path(p).resolve()
              for c in (r, *r.parents):
                  if os.stat(c).st_mode & 0o022:
                      return False
              return True
          d = area.configured_area() / 'runner-tmp'
          d.mkdir(mode=0o700, parents=True, exist_ok=True)
          if not ancestors_private(d):
              d = pathlib.Path.home() / '.local/state/swarm-fixtures' / 'runner-tmp'
              d.mkdir(mode=0o700, parents=True, exist_ok=True)
              if not ancestors_private(d):
                  raise SystemExit('recipe-tmpdir-ancestors-not-private: ' + str(d))
          print('SWARM_RUNNER_TMPDIR=' + str(d))
          PYEOF
      - run: TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked --workspace --lib
      - run: TMPDIR="$SWARM_RUNNER_TMPDIR" cargo test --manifest-path rust/Cargo.toml --locked -p swarm-cli --test version_no_repository
      - run: npm test
      - run: make smoke
      - run: SWARM_STATUS_CONTRACT_BINARY="$PWD/bin/swarm" python3 tools/verification/recipe.py run --recipe tools/verification/recipes/existing-cockpit-rust.json --output .cache/ci-cockpit
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Restore namespace test environment
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/swarm-userns-before" ]; then
            saved="$(cat "$RUNNER_TEMP/swarm-userns-before")"
            case "$saved" in 0|1) ;; *) exit 1 ;; esac
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$saved"
          fi

      - name: Retain cockpit recipe diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-recipe-diagnostics
          path: |
            .cache/ci-cockpit/result.json
            .cache/ci-cockpit/step-*.json
            .cache/ci-cockpit/step-*.stdout
            .cache/ci-cockpit/step-*.stderr
            .cache/existing-cockpit-*/journey/browser.stderr
            .cache/existing-cockpit-*/journey/browser/failure.json
            .cache/agent-logs-*/journey/browser.stderr
            .cache/agent-logs-*/journey/browser/failure.json
          if-no-files-found: warn
          include-hidden-files: true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - run: cargo fetch --locked --manifest-path rust/Cargo.toml
      - run: |
          python3 tests/test_rust_install_outputs.py
          make test-install

      - name: Retain installation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installation-diagnostics
          path: |
            .cache/install-native-*/commands.json
            .cache/install-native-*/*.stdout
            .cache/install-native-*/*.stderr
            .cache/install-native-*/result.json
            .cache/install-docker-*/commands.json
            .cache/install-docker-*/*.stdout
            .cache/install-docker-*/*.stderr
            .cache/install-docker-*/result.json
          if-no-files-found: warn
          include-hidden-files: true
