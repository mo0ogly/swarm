[package]
name = "swarm-enrollment-state"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
swarm-identity-contract = { path = "../swarm-identity-contract" }
swarm-enrollment-proof = { path = "../swarm-enrollment-proof" }
swarm-wire-json = { path = "../swarm-wire-json" }
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }

[dev-dependencies]
tempfile = "=3.27.0"
