[package]
name = "swarm-linux-identity-channel"
version = "0.1.0"
edition = "2021"
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.186"
nix = { version = "=0.30.1", default-features = false, features = ["fs", "poll", "signal"] }
zeroize = "=1.9.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["socket", "fs", "user", "uio"] }

[features]
test-fixtures = []

[[example]]
name = "channel_probe"
required-features = ["test-fixtures"]
