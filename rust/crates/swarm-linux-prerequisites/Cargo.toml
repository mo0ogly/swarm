[package]
name = "swarm-linux-prerequisites"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["user"] }

[dev-dependencies]
serde_json = "=1.0.150"
tempfile = "=3.27.0"
