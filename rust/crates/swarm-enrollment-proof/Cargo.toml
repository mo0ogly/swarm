[package]
name = "swarm-enrollment-proof"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Never enable in a production binary: explicit entropy injection is fixture-only.
test-fixtures = []

[dependencies]
swarm-wire-json = { path = "../swarm-wire-json" }
swarm-identity-contract = { path = "../swarm-identity-contract" }
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
getrandom = { version = "=0.2.17", features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
sha2 = "=0.10.9"

[[example]]
name = "proof_probe"
required-features = ["test-fixtures"]
