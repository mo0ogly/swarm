[package]
name = "swarm-enrollment-config"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-fixtures = []

[dependencies]
base64 = "=0.22.1"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "large-dates"] }
swarm-identity-contract = { path = "../swarm-identity-contract", features = ["serde"] }
swarm-wire-json = { path = "../swarm-wire-json", features = ["timestamp"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
nix = { version = "=0.30.1", default-features = false }
getrandom = { version = "=0.2.17", features = ["std"] }
zeroize = "=1.9.0"
subtle = "=2.6.1"

[dev-dependencies]
tempfile = "=3.27.0"

[[example]]
name = "config_store_probe"
required-features = ["test-fixtures"]
