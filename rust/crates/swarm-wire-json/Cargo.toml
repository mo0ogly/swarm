[package]
name = "swarm-wire-json"
version = "0.1.0"
edition = "2021"
publish = false

[features]
timestamp = ["dep:time"]

[dependencies]
serde = "=1.0.228"
serde_json = { version = "=1.0.150", features = ["raw_value"] }
time = { version = "=0.3.55", features = ["formatting", "parsing", "large-dates"], optional = true }

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
