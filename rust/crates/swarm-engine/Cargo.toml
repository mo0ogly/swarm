[package]
name = "swarm-engine"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-fixtures = []

[dependencies]
c_http = { package = "http", version = "=1.5.0" }
base64 = "=0.22.1"
hmac = "=0.13.0"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
zeroize = "=1.9.0"
subtle = "=2.6.1"
sha2_csrf = { package = "sha2", version = "=0.11.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value", "float_roundtrip", "unbounded_depth"] }
serde_stacker = "=0.1.14"
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["large-dates", "formatting"] }
getrandom = { version = "=0.2.17", features = ["std"] }
swarm-identity-contract = { path = "../swarm-identity-contract", features = ["serde"] }
swarm-wire-json = { path = "../swarm-wire-json", features = ["timestamp"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "unicode"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false, features = ["hostname", "user", "process", "socket"] }
rustix = { version = "=1.1.5", features = ["fs", "process", "event", "stdio", "time", "net"] }

[dev-dependencies]
tempfile = "=3.27.0"
swarm-enrollment-bootstrap = { path = "../swarm-enrollment-bootstrap" }
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-enrollment-state = { path = "../swarm-enrollment-state" }

