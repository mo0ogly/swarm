[package]
name = "swarm-cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
swarm-enrollment-bootstrap = { path = "../swarm-enrollment-bootstrap" }
swarm-engine = { path = "../swarm-engine" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false }

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-identity-contract = { path = "../swarm-identity-contract" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[[bin]]
name = "swarm-rust"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
swarm-web = { path = "../swarm-web" }
tokio = { version = "=1.54.0", default-features = false, features = ["signal", "rt", "time", "sync"] }
