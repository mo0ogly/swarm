[package]
name = "swarm-cli"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-fixtures = ["swarm-enrollment-authority/test-fixtures"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
swarm-enrollment-bootstrap = { path = "../swarm-enrollment-bootstrap" }
swarm-engine = { path = "../swarm-engine" }
swarm-protection-contract = { path = "../swarm-protection-contract" }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
base64 = "=0.22.1"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-identity-contract = { path = "../swarm-identity-contract" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[[bin]]
name = "swarm-rust"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
swarm-identity-contract = { path = "../swarm-identity-contract" }
swarm-api-client = {path="../swarm-api-client"}
zeroize = "=1.9.0"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-enrollment-authority = { path = "../swarm-enrollment-authority" }
swarm-enrollment-state = { path = "../swarm-enrollment-state" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
swarm-web = { path = "../swarm-web" }
tokio = { version = "=1.54.0", default-features = false, features = ["signal", "rt", "time", "sync", "macros", "net"] }
