[package]
name = "swarm-enrollment-bootstrap"
version = "0.1.0"
edition = "2021"
publish = false

[features]
test-fixtures = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-identity-contract = { path = "../swarm-identity-contract" }
swarm-wire-json = { path = "../swarm-wire-json" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
nix = { version = "=0.30.1", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"


[[example]]
name = "bootstrap_probe"
required-features = ["test-fixtures"]
