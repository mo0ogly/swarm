[package]
name = "swarm-authority"
version = "0.1.0"
edition = "2021"
publish = false
description = "Swarm cockpit authority daemon (phase B): runs under its own system UID"

[[bin]]
name = "swarm-authority"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
swarm-enrollment-bootstrap = { path = "../swarm-enrollment-bootstrap" }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
sha2 = "=0.10.9"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-identity-contract = { path = "../swarm-identity-contract", features = ["serde"] }
