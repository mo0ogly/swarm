[package]
name = "swarm-authority"
version = "0.1.0"
edition = "2021"
publish = false
description = "Swarm cockpit authority daemon (phase B): runs under its own system UID"

[[bin]]
name = "swarm-authority"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
swarm-enrollment-bootstrap = { path = "../swarm-enrollment-bootstrap" }
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-enrollment-state = { path = "../swarm-enrollment-state" }
swarm-enrollment-authority = { path = "../swarm-enrollment-authority" }
swarm-identity-contract = { path = "../swarm-identity-contract", features = ["serde"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
base64 = "=0.22.1"
http = "=1.5.0"
cookie = { version = "=0.18.2", default-features = false }
form_urlencoded = "=1.2.2"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.54.0", default-features = false, features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process", "termios"] }

[dev-dependencies]
tempfile = "=3.27.0"
serde_json = "=1.0.150"
sha2 = "=0.10.9"
swarm-enrollment-config = { path = "../swarm-enrollment-config" }
swarm-identity-contract = { path = "../swarm-identity-contract", features = ["serde"] }
