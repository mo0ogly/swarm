[package]
name = "swarm-web"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
http = "=1.5.0"
cookie = { version = "=0.18.2", default-features = false }
sha2 = "=0.10.9"
subtle = "=2.6.1"
swarm-identity-contract = { path = "../swarm-identity-contract" }
swarm-protection-contract = { path = "../swarm-protection-contract" }
swarm-engine = { path = "../swarm-engine" }
swarm-wire-json = { path = "../swarm-wire-json" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.54.0", default-features = false, features = ["rt", "net", "time", "sync", "signal", "macros"] }

hmac = "=0.13.0"
sha2-csrf = { package = "sha2", version = "=0.11.1" }
form_urlencoded = "=1.2.2"

[dev-dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled", "functions"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", default-features = false }
