[workspace]
members = ["crates/swarm-linux-prerequisites", "crates/swarm-biba-linux", "crates/swarm-linux-identity-channel", "crates/swarm-api-client", "crates/swarm-identity-contract", "crates/swarm-protection-contract", "crates/swarm-enrollment-proof", "crates/swarm-wire-json", "crates/swarm-enrollment-state", "crates/swarm-enrollment-authority", "crates/swarm-enrollment-config", "crates/swarm-enrollment-bootstrap", "crates/swarm-cli", "crates/swarm-engine", "crates/swarm-web", "crates/swarm-authority"]
resolver = "2"

# Shared data-only confidentiality contract; runtime authorities remain in engine.
[workspace.dependencies]
swarm-confidentiality = { path = "crates/swarm-confidentiality" }

# Local native delivery uses dev. Keep complete candidate/receipt SHA-256
# checks affordable without altering the algorithms, guards or saved deadlines.
[profile.dev.package.sha2]
opt-level = 3

# Optimize the JSON hot paths of the local delivery profile without changing
# wire bytes, digest algorithms, or the default safety assertions of dev.
[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.swarm-wire-json]
opt-level = 2
